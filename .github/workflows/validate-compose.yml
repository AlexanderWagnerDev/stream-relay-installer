name: Validate Compose and shell
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate Compose configuration
        env:
          LRTMP2_API_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          PANEL_PASSWORD: validation-only-password
        run: docker compose config --quiet
      - name: Check panel startup configuration from the matching upstream channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenRTMP/librtmp2-server-panel
          ref: v0.1.10
          path: .upstream
          persist-credentials: false
      - name: Test rendered deployment against upstream startup guards
        env:
          PANEL_SOURCE_DIR: ${{ github.workspace }}/.upstream
        run: python3 -m unittest discover -s tests -v
